<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <defs>
    <linearGradient id="shield-grad" x1="0" y1="0" x2="32" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="eye-grad" x1="0" y1="0" x2="32" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e0e7ff"/>
    </linearGradient>
  </defs>
  <!-- Shield -->
  <path d="M16 2L4 7v9c0 7 5.4 12.5 12 14 6.6-1.5 12-7 12-14V7L16 2z" fill="url(#shield-grad)"/>
  <!-- Eye outline -->
  <ellipse cx="16" cy="16" rx="7" ry="4.5" stroke="url(#eye-grad)" stroke-width="1.5" fill="none"/>
  <!-- Iris -->
  <circle cx="16" cy="16" r="2.5" fill="url(#eye-grad)"/>
  <!-- Pupil -->
  <circle cx="16" cy="16" r="1.1" fill="#6366f1"/>
  <!-- Scan lines -->
  <line x1="9" y1="16" x2="11" y2="16" stroke="white" stroke-width="1" stroke-linecap="round" opacity="0.5"/>
  <line x1="21" y1="16" x2="23" y2="16" stroke="white" stroke-width="1" stroke-linecap="round" opacity="0.5"/>
</svg>
