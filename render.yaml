services:
  - type: web
    name: deepguard-ai
    env: python
    rootDir: ai-module
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: HF_API_TOKEN
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false

  - type: web
    name: deepguard-backend
    env: node
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: AI_SERVICE_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
